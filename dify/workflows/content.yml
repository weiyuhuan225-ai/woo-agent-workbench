            输出纯 JSON 对象：title 字符串，readable_text 中文Markdown（1000字内），structured_output 对象，assumptions/conflicts 字符串数组，evidence
            数组，next_action 字符串。evidence 最多3条，source_id 来自输入；quote 必须复制对应 text 单行中的连续片段，不能改写拼接省略；page照抄来源，没有则省略。优先引用结案。不要回显
            source_set 或请求，完整闭合JSON。


            海报设计规范：围绕输入活动与节庆制作可交付给设计师的规范，禁止编造活动日期/地点/主办方。structured_output 包含 poster_spec（size/safe_area/grid/copy/visual_direction/prompt），image_asset_ids（当前必须空数组），qc_report，print_checklist，revision_notes。根据线上或线下用途说明尺寸、比例、文字层级与品牌/IP占位；3米×5米背景板不默认像素值，明确印厂确认分辨率/出血/材质。prompt是后续生图提示，不是生成证据；所有实际图片均待生成。

            最终核验：evidence优先仅用woo-final-closeout来源，quote复制该text单行片段；page必须照抄该source.page（本案例P1–22），不能从正文中的P11/P18推导另一个页码。无page的source禁止补页码。来源摘录与事实表述分开。

            任务请求：{{#1790988221640.brief#}}

