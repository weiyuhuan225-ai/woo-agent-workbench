      zIndex: 0
    - data:
        code: "import json\n\ndef main(request_json: str, model_text: str) -> dict:\n    req = {}\n    errors = []\n    raw\
          \ = {}\n    try:\n        req = json.loads(request_json)\n        if not isinstance(req, dict):\n            req\
          \ = {}\n            raise ValueError('输入必须为 JSON 对象')\n        for name in ['run_id','project_context','source_set','task']:\n\
          \            if not req.get(name): errors.append('缺少字段：'+name)\n        if req.get('agent_key') != 'strategy': errors.append('能力类型与流程不匹配')\n\
          \        text = model_text.strip()\n        if text.startswith('```'):\n            text = text.split('\\n',1)[1].rsplit('```',1)[0]\n\
          \        raw = json.loads(text)\n        if not isinstance(raw, dict): raise ValueError('模型输出必须为对象')\n        for\
          \ k in ['title','readable_text','structured_output','assumptions','conflicts','evidence','next_action']:\n     \
          \       if k not in raw: errors.append('模型输出缺少：'+k)\n        if not isinstance(raw.get('structured_output'),dict):\
          \ errors.append('结构化产物不是对象')\n        sources = req.get('source_set',[])\n        if not isinstance(sources,list):\
          \ sources=[];errors.append('source_set 必须为数组')\n        ids = {s.get('id') for s in sources if isinstance(s,dict)}\n\
          \        for e in raw.get('evidence',[]):\n            if not isinstance(e,dict) or e.get('source_id') not in ids:\
          \ errors.append('证据引用了未知来源')\n        for fact in raw.get('structured_output',{}).get('facts',[]):\n           \
          \ if not isinstance(fact,dict) or fact.get('source_id') not in ids: errors.append('事实引用了未知来源')\n        for k in\
          \ ['assumptions','conflicts']:\n            if not isinstance(raw.get(k),list) or any(not isinstance(x,str) for\
          \ x in raw.get(k,[])): errors.append(k+'必须为字符串数组')\n    except Exception as e:\n        errors.append(str(e))\n\
          \    errors=list(dict.fromkeys(errors))\n    result={'schema_version':'2.1','run_id':str(req.get('run_id','invalid-input')),'agent_key':'strategy','agent_version':'2.1-text','execution_mode':'live','review_status':'needs_clarification'\
          \ if errors else 'awaiting_review','title':str(raw.get('title','输入或输出需要修订')),'readable_text':str(raw.get('readable_text','请补充输入并检查模型输出。')),'structured_output':raw.get('structured_output',{})\
          \ if isinstance(raw.get('structured_output'),dict) else {},'assumptions':raw.get('assumptions',[]) if isinstance(raw.get('assumptions'),list)\
          \ else [],'conflicts':raw.get('conflicts',[]) if isinstance(raw.get('conflicts'),list) else [],'evidence':raw.get('evidence',[])\
          \ if isinstance(raw.get('evidence'),list) and not any('来源' in x for x in errors) else [],'next_action':str(raw.get('next_action','修复输入/来源后重试')),'source_set':req.get('source_set',[])\
          \ if isinstance(req.get('source_set'),list) else [],'validation_errors':errors}\n    return {'result':result}\n"
        code_language: python3
        outputs:
          result:
            children: null
            type: object
        selected: false
        title: 结构与来源校验
        type: code
        variables:
        - value_selector:
          - start_node
          - request_json
          value_type: string
          variable: request_json
        - value_selector:
          - '1791108592020'
          - text
          value_type: string
          variable: model_text
      height: 52
      id: '1791108688712'
      position:
        x: 938
