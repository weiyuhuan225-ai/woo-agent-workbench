    - data:
        code: "import json\ndef main(request_json: str) -> dict:\n    try:\n        req = json.loads(request_json)\n     \
          \   required = ['run_id', 'agent_key', 'project_context', 'source_set', 'task']\n        missing = [x for x in required\
          \ if not req.get(x)]\n        if missing: raise ValueError('缺少必填字段：' + ', '.join(missing))\n        if req['agent_key']\
          \ != 'strategy': raise ValueError('agent_key 与流程不匹配')\n        sources = req['source_set']\n        if not isinstance(sources,\
          \ list): raise ValueError('source_set 必须是数组')\n        for s in sources:\n            if not all(k in s for k in\
          \ ['id','version','date','type','confidence']):\n                raise ValueError('来源缺少版本/日期/类型/可信度字段')\n      \
          \  result = {'schema_version':'2.1', 'run_id':req['run_id'], 'agent_key':'strategy', 'agent_version':'2.0-m1', 'execution_mode':'mock',\
          \ 'review_status':'awaiting_review', 'title':'契约验证通过（模拟）', 'readable_text':'已验证输入与来源字段。尚未执行模型、检索或媒体工具。此结果不可作为业务产物验收。',\
          \ 'structured_output':{}, 'assumptions':[], 'conflicts':[], 'evidence':[], 'next_action':'接入专业节点和真实工具后执行 M4 测试',\
          \ 'source_set':sources, 'validation_errors':[]}\n    except Exception as e:\n        result = {'schema_version':'2.1','agent_key':'strategy','agent_version':'2.0-m1','execution_mode':'mock','review_status':'needs_clarification','title':'输入验证失败','readable_text':str(e),'structured_output':{},'assumptions':[],'conflicts':[],'evidence':[],'next_action':'修复输入后重试','validation_errors':[str(e)]}\n\
          \    return {'result':result}\n"
        code_language: python3
        desc: M1 模拟：无模型及外部操作
        outputs:
          result:
            children: null
            type: object
        selected: false
        title: 输入及来源校验 · 模拟
        type: code
