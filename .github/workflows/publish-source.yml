name: Expand public source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-source.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'weiyuhuan225-ai/woo-agent-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand the reviewed source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile, hashlib, os
          archive = Path('WOO_Agent_Workbench_GitHub.zip')
          expected = '6669bf9731403807f477e8b81267473de6f3cfd6da3da7f795d489c68b63553b'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          paths = []
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert len(z.infolist()) == 327
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] == 'woo-agent-workbench'
                  relative = Path(*p.parts[1:])
                  assert '.git' not in relative.parts and 'node_modules' not in relative.parts
                  content = z.read(item)
                  if relative.as_posix().startswith('.github/workflows/'):
                      assert relative.read_bytes() == content, 'Workflow must already match the reviewed template'
                  relative.parent.mkdir(parents=True, exist_ok=True)
                  relative.write_bytes(content)
                  paths.append(relative.as_posix())
          Path(os.environ['RUNNER_TEMP'], 'woo-source-files').write_bytes(bytes([0]).join(p.encode() for p in paths)+bytes([0]))
          print('Verified and expanded 327 reviewed source files.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:public
      - run: npm run test:contracts
      - run: npm run test:production
      - run: npm run build
      - name: Publish verified source with a private author email
        shell: bash
        run: |
          git config user.name 'weiyuhuan225-ai'
          git config user.email '225829194+weiyuhuan225-ai@users.noreply.github.com'
          git add --pathspec-from-file="$RUNNER_TEMP/woo-source-files" --pathspec-file-nul
          git rm -- WOO_Agent_Workbench_GitHub.zip
          git diff --cached --check
          git commit -m 'Publish verified and sanitized WOO source files'
          git push origin HEAD:main
